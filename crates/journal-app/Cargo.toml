[package]
name = "journal-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trainingstagebuch"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
journal-core = { path = "../journal-core" }
rfd = "0.17.2"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3.27.0"
